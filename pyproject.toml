[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-omics-ml"
version = "0.1.0"
description = "PyTorch workflows for cancer multi-omics analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
notebooks = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<8"]

[project.urls]
Repository = "https://github.com/pjp72-Un/cancer_omics_ml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
