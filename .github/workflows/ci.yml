name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Check Python style
        run: |
          python -m ruff check src tests plot_style
          python -m ruff format --check src tests plot_style
      - name: Test learning workflow without private inputs
        run: python -m unittest discover -s tests -v
      - name: Check dependencies and PyTorch
        run: |
          python - <<'PY'
          import matplotlib
          import numpy
          import pandas
          import sklearn
          import torch

          value = torch.tensor([2.0], requires_grad=True)
          value.square().sum().backward()
          torch.testing.assert_close(value.grad, torch.tensor([4.0]))
          print(f"PyTorch {torch.__version__}: CPU autograd passed")
          PY
